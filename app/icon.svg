  <g stroke="#f7f5f1" stroke-width="5" stroke-linecap="butt" fill="none">
    <path d="M17 22 V46 M17 22 L32 34 L47 22 M47 22 V46" />
  </g>
  <rect x="21" y="52" width="22" height="1.5" fill="#7d5c42" />
</svg>
